name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      NODE_ENV: test
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: ./buddy key:generate
      - run: ./buddy lint
      - run: ./buddy typecheck
      - run: ./buddy migrate
      - run: ./buddy test
      - run: bun scripts/build-support-elements.ts
      - run: ./buddy build:views
