name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.2.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      NODE_ENV: test
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci.sqlite
      STACKS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      SUPPORT_TEST_REDIS_URL: redis://127.0.0.1:6379
      MAIL_MAILER: capture
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: ./buddy key:generate
      - run: ./buddy generate:auto-imports
      - run: bun scripts/build-support-elements.ts
        env:
          APP_ENV: production
          NODE_ENV: production
          APP_URL: https://hq.support
          APP_DOMAIN: hq.support
      - name: Qualify compiled widget in Chromium
        timeout-minutes: 8
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun --no-env-file scripts/qualify-support-browser.ts --skip-build
      - name: Upload widget browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-browser-${{ github.run_attempt }}
          path: storage/framework/runtime/support-browser
          if-no-files-found: error
          retention-days: 7
      - name: Prepare reviewed component publication artifact
        env:
          SUPPORT_ELEMENTS_VERSION: 0.1.0-alpha.0
          CHROME_PATH: /usr/bin/google-chrome
        run: bun --no-env-file scripts/support-elements-release.ts prepare
      - name: Retain same-commit component publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: support-elements-${{ github.sha }}
          path: storage/framework/runtime/support-elements-release
          if-no-files-found: error
          retention-days: 14
      - run: ./buddy lint
      - run: ./buddy typecheck
      - run: ./buddy migrate
      - name: Verify model migration freshness
        run: |
          ./buddy generate:migrations --dialect all
          git diff --exit-code -- database/migrations storage/framework/database
          test -z "$(git ls-files --others --exclude-standard database/migrations)"
      - run: ./buddy test
      - run: ./buddy build:views
        env:
          APP_ENV: production
          NODE_ENV: production
          APP_URL: https://hq.support
          APP_DOMAIN: hq.support
