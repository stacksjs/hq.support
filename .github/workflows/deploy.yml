name: Deploy

# Broad public launch waits for the complete qualified feature matrix.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview infrastructure without changing it
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: hq-support-production
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: ./buddy deploy --prod --dry-run --json

  production:
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.workflow_runs | any(.head_sha == env.GITHUB_SHA and .event == "push")' | grep -qx true
      - run: bun install --frozen-lockfile
      - name: Require complete launch qualification
        env:
          SUPPORT_LAUNCH_QUALIFICATION: ${{ secrets.SUPPORT_LAUNCH_QUALIFICATION }}
        run: |
          test -n "$SUPPORT_LAUNCH_QUALIFICATION"
          bun scripts/check-launch.ts
      - name: Build verified source
        env:
          APP_ENV: production
          NODE_ENV: production
          APP_URL: https://hq.support
          APP_DOMAIN: hq.support
          SITE_URL: https://hq.support
        run: bun scripts/build-support-elements.ts && ./buddy build:views
      - name: Load deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
      - name: Deploy with Buddy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./buddy deploy --prod --yes
      - name: Verify production HTTPS and Messenger configuration
        run: |
          curl -fsS --retry 5 --max-time 15 https://hq.support/ -o "$RUNNER_TEMP/hq-home.html"
          grep -q 'id="site-chat"' "$RUNNER_TEMP/hq-home.html"
          curl -fsS --retry 5 --max-time 15 https://hq.support/support.js -o "$RUNNER_TEMP/hq-support.js"
          cmp public/support.js "$RUNNER_TEMP/hq-support.js"
          curl -fsS --retry 5 --max-time 15 https://hq.support/api/support/site-messenger | jq -e '.project | type == "string" and test("^[a-fA-F0-9-]{36}$")'
