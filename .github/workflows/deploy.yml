name: Deploy

# Broad public launch waits for the complete qualified feature matrix.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview infrastructure without changing it
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: hq-support-production
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: ./buddy deploy --prod --dry-run --json

  production:
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Find successful CI for this exact main commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&branch=main&event=push" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - name: Require complete launch qualification
        env:
          SUPPORT_LAUNCH_QUALIFICATION: ${{ secrets.SUPPORT_LAUNCH_QUALIFICATION }}
        run: |
          test -n "$SUPPORT_LAUNCH_QUALIFICATION"
          bun scripts/check-launch.ts
      - name: Verify ownership of the Messenger artifact
        id: widget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPPORT_ELEMENTS_CI_RUN: ${{ steps.ci.outputs.run_id }}
          SUPPORT_ELEMENTS_SOURCE_SHA: ${{ github.sha }}
        run: |
          version=$(bun --no-env-file -e 'import library from "./config/library"; console.log(library.packages.find(pkg => pkg.name === "@stacksjs/support-elements")?.version ?? "")')
          SUPPORT_ELEMENTS_VERSION="$version" bun --no-env-file scripts/verify-elements-registry-source.ts
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ steps.widget.outputs.artifact_id }}
          path: storage/framework/runtime/support-elements-release
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build views with the qualified Messenger
        env:
          APP_ENV: production
          NODE_ENV: production
          APP_URL: https://hq.support
          APP_DOMAIN: hq.support
          SITE_URL: https://hq.support
          SUPPORT_ELEMENTS_VERSION: ${{ steps.widget.outputs.version }}
        run: |
          bun --no-env-file scripts/support-elements-release.ts stage-site
          ./buddy build:views
      - name: Load deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
      - name: Deploy with Buddy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SUPPORT_SITE_MESSENGER_PROJECT_ID: ${{ vars.SUPPORT_SITE_MESSENGER_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$HCLOUD_TOKEN" || { echo "::error::Set the production HCLOUD_TOKEN secret."; exit 1; }
          ./buddy deploy --prod --yes
      - name: Verify production HTTPS, Help Center, and Messenger assets
        shell: bash
        run: |
          curl -fsS --retry 5 --max-time 15 https://hq.support/ -o "$RUNNER_TEMP/hq-home.html"
          grep -q 'id="site-chat"' "$RUNNER_TEMP/hq-home.html"
          curl -fsSL --retry 5 --max-time 15 https://help.hq.support/ -o "$RUNNER_TEMP/hq-help.html"
          grep -q 'Practical guides for setting up your workspace' "$RUNNER_TEMP/hq-help.html"
          curl -fsSL --retry 5 --max-time 15 https://help.hq.support/getting-started -o "$RUNNER_TEMP/hq-guide.html"
          grep -q 'Start with a workspace' "$RUNNER_TEMP/hq-guide.html"
          test "$(curl -fsS --retry 5 --max-time 15 -o /dev/null -w '%{redirect_url}' 'https://help.hq.support/article?project=fixture&slug=guide&locale=en')" = 'https://hq.support/help/article?project=fixture&slug=guide&locale=en'
          version=$(jq -er '.version' public/widgets/manifest.json)
          jq -er '.hosted | keys[] | "/" + .' storage/framework/runtime/support-elements-release/release.json | while IFS= read -r path; do
            curl -fsS --retry 5 --max-time 15 "https://hq.support$path" -o "$RUNNER_TEMP/hq-widget-asset"
            cmp "public$path" "$RUNNER_TEMP/hq-widget-asset"
            curl -fsS --retry 5 --max-time 15 -H 'Origin: https://example.test' -D "$RUNNER_TEMP/hq-widget-headers" "https://cdn.hq.support$path" -o "$RUNNER_TEMP/hq-widget-asset"
            cmp "public$path" "$RUNNER_TEMP/hq-widget-asset"
            grep -qiE '^access-control-allow-origin: \*[[:space:]]*$' "$RUNNER_TEMP/hq-widget-headers"
            case "$path" in
              /widgets/"$version"/*) grep -qiE '^cache-control: .*immutable' "$RUNNER_TEMP/hq-widget-headers" ;;
              *) grep -qiE '^cache-control: .*no-cache' "$RUNNER_TEMP/hq-widget-headers" ;;
            esac
          done
          for path in / /api/health /app; do
            test "$(curl -sS --retry 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://cdn.hq.support$path")" = 404
          done
      - name: Open the first-party Messenger on production HTTPS
        timeout-minutes: 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SUPPORT_SITE_MESSENGER_PROJECT_ID: ${{ vars.SUPPORT_SITE_MESSENGER_PROJECT_ID }}
        run: bun --no-env-file scripts/verify-hosted-site-messenger.ts https://hq.support
